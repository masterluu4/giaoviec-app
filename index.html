const isWork = s => { const w = D.parse(s).getDay(); return w !== 0 && w !== 6; };
function normStart(s, mode) { if (mode === 'mf') { let i = 0; while (!isWork(s) && i < 7) { s = D.add(s, 1); i++; } } return s; }
function endOf(s, days, mode) {
  days = Math.max(0, +days || 0);
  if (days <= 0) return s;
  if (mode !== 'mf') return D.add(s, Math.ceil(days) - 1);
  let d = s, c = 1; 
  while (c < Math.ceil(days)) { d = D.add(d, 1); if (isWork(d)) c++; } 
  return d;
}

    if (f.lateOnly && !a.late) return false; // <--- THÊM DÒNG NÀY
    if (f.q) { const q = f.q.toLowerCase(); const hay = [a.ma, a.ten, a.moTa, a.lyDoTre, a.nguoiNhan ? (personOf(a.nguoiNhan)?.ten || '') : ''].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }).sort((a, b) => (a.deadline || '').localeCompare(b.deadline || ''));
}

/* === Biểu đồ S-Curve chuyên đề === */
function topicSCurve(tid) {
  const st = topicStats(tid); if (!st.n) return '<div class="empty">Chưa có hoạt động</div>';
  const vt = st.vt, today = D.today();
  let from = st.start, to = st.end > today ? st.end : today;
  const total = D.diff(to, from) + 1, step = Math.max(1, Math.ceil(total / 30)), pts = [];
  for (let k = 0; k < total; k += step) pts.push(D.add(from, k)); if (pts[pts.length - 1] !== to) pts.push(to);
  const wavg = (arr, f) => { const W = sum(arr, t => t.days || 0); return W ? sum(arr, t => (t.days || 0) * f(t)) / W : (arr.length ? sum(arr, f) / arr.length : 0); };
  const planAt = (t, d) => t.days === 0 ? (d >= t.s ? 100 : 0) : Math.max(0, Math.min(1, (D.diff(d, t.s) + 1) / t.span)) * 100;
  const pctAt = (t, d) => { if (d >= today) return t.pct; const lg = (t.log || []).filter(x => x[0] <= d).sort((a, b) => a[0].localeCompare(b[0])); if (lg.length) return lg[lg.length - 1][1]; if ((t.log || []).length) return 0; if (d < t.s) return 0; return t.pct * Math.min(1, (D.diff(d, t.s) + 1) / Math.max(1, D.diff(today, t.s) + 1)); };
  const W = 640, H = 240, L = 44, R = 16, T = 14, B = 30, iw = W - L - R, ih = H - T - B, n = pts.length;
  const X = i => L + (n === 1 ? iw / 2 : iw * i / (n - 1)), Y = v => T + ih - ih * Math.max(0, Math.min(100, v)) / 100;
  let g = '';
  for (let k = 0; k <= 4; k++) { const y = T + ih - ih * k / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#eef0f5" ${k ? 'stroke-dasharray="3 4"' : ''}/><text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#98a2b3">${k * 25}%</text>`; }
  const every = Math.ceil(n / 8); pts.forEach((d, i) => { if (i % every === 0) g += `<text x="${X(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="#667085">${F.date(d).slice(0, 5)}</text>`; });
  const plan = pts.map(d => wavg(vt, t => planAt(t, d))), act = pts.map(d => d <= today ? wavg(vt, t => pctAt(t, d)) : null);
  g += `<polyline points="${plan.map((v, i) => X(i) + ',' + Y(v)).join(' ')}" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>`;
  const ai = act.map((v, i) => v === null ? null : [X(i), Y(v)]).filter(Boolean);
  if (ai.length) g += `<polygon points="${ai[0][0]},${T + ih} ${ai.map(p => p.join(',')).join(' ')} ${ai[ai.length - 1][0]},${T + ih}" fill="${THEME.p}" opacity=".12"/><polyline points="${ai.map(p => p.join(',')).join(' ')}" fill="none" stroke="${THEME.p}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((d, i) => { if (act[i] !== null) g += `<circle cx="${X(i)}" cy="${Y(act[i])}" r="4" fill="#fff" stroke="${THEME.p}" stroke-width="2" data-tip="${F.date(d)}\nThực tế: ${F.pct(act[i])}\nKế hoạch: ${F.pct(plan[i])}"/>`; });
  const ti = pts.findIndex(d => d >= today); if (ti >= 0) g += `<line x1="${X(ti)}" x2="${X(ti)}" y1="${T}" y2="${T + ih}" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  return `<div class="chart"><div class="legend"><span><i style="background:${THEME.p}"></i>Thực tế</span><span><i style="background:#94a3b8"></i>Kế hoạch</span></div><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}

/* === GANTT === */
function ganttSVGFor(rows, o) {
  const { a, n } = o.range;
  const zoom = o.zoom;
  let slotsPerDay = zoom === 'halfday' ? 2 : zoom === 'hour' ? 8 : 1;
  const dw = o.dw; 
  const dayW = dw * slotsPerDay;
  const totalSlots = n * slotsPerDay;
  const W = totalSlots * dw;
  
  const headH = slotsPerDay > 1 ? 78 : 48;
  const ROW_H = 56; // Tăng chiều cao lên 56px để chứa được 2-3 dòng text
  const H = headH + rows.length * ROW_H;
  const today = D.today();
  const X = d => D.diff(d, a) * dayW;
  const rowY = i => headH + i * ROW_H;
  
  let g = `<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
  
  // 1. Vẽ nền cuối tuần
  for (let d = 0; d < n; d++) {
    const dateStr = D.add(a, d);
    const dt = D.parse(dateStr);
    const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
    const x = d * dayW;
    if (isWeekend) g += `<rect x="${x}" y="${headH}" width="${dayW}" height="${H - headH}" fill="#f8fafc"/>`;
  }
  
  // 2. Vẽ Header
  g += `<rect x="0" y="0" width="${W}" height="${headH}" fill="#1e3a8a"/>`;
  g += `<line x1="0" x2="${W}" y1="${headH}" y2="${headH}" stroke="#94a3b8" stroke-width="2"/>`;
  if (slotsPerDay > 1) g += `<line x1="0" x2="${W}" y1="24" y2="24" stroke="#cbd5e1"/><line x1="0" x2="${W}" y1="48" y2="48" stroke="#cbd5e1"/><line x1="0" x2="${W}" y1="78" y2="78" stroke="#cbd5e1"/>`;
  else g += `<line x1="0" x2="${W}" y1="24" y2="24" stroke="#cbd5e1"/>`;
  
  let lastMonth = '';
  for (let d = 0; d < n; d++) {
    const dateStr = D.add(a, d);
    const dt = D.parse(dateStr);
    const ym = dateStr.slice(0, 7);
    const x = d * dayW;
    
    if (ym !== lastMonth) {
      lastMonth = ym;
      // Tính toán độ rộng của tháng để căn giữa chữ
      let monthDays = 0;
      let tempD = d;
      while (tempD < n && D.add(a, tempD).slice(0, 7) === ym) { monthDays++; tempD++; }
      const monthW = monthDays * dayW;
      const centerX = x + monthW / 2;

      g += `<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="#94a3b8" stroke-width="1.5"/>`;
      g += `<text x="${centerX}" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Tháng ${+ym.slice(5,7)} Năm ${ym.slice(0,4)}</text>`;
    }
    
    if (slotsPerDay > 1) {
      g += `<text x="${x + dayW/2}" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="${dateStr === today ? '#facc15' : '#fff'}">${dt.getDate()}/${dt.getMonth()+1}</text>`;
      for (let s = 0; s < slotsPerDay; s++) {
        const sx = x + s * dw;
        let label = zoom === 'halfday' ? (s === 0 ? 'Sáng' : 'Chiều') : `${8 + s}h`;
        g += `<line x1="${sx}" x2="${sx}" y1="48" y2="${H}" stroke="#cbd5e1"/>`;
        g += `<text x="${sx + dw/2}" y="62" text-anchor="middle" font-size="10" fill="#e2e8f0">${label}</text>`;
      }
    } else {
      g += `<text x="${x + dw/2}" y="${headH - 10}" text-anchor="middle" font-size="11" font-weight="700" fill="${dateStr === today ? '#facc15' : '#fff'}">${dt.getDate()}/${dt.getMonth()+1}</text>`;
      g += `<line x1="${x}" x2="${x}" y1="24" y2="${H}" stroke="#cbd5e1"/>`;
    }
  }

  // 3. Vẽ các dòng kẻ ngang & nền
  rows.forEach((r, i) => { 
    g += `<line x1="0" x2="${W}" y1="${rowY(i) + ROW_H}" y2="${rowY(i) + ROW_H}" stroke="#cbd5e1"/>`; 
    if (r.isHighlight) g += `<rect x="0" y="${rowY(i)}" width="${W}" height="${ROW_H}" fill="#fff1f2"/>`; 
    if (r.type === 'summary') g += `<rect x="0" y="${rowY(i)}" width="${W}" height="${ROW_H}" fill="#e2e8f0"/>`;
    if (r.isTitleRow) g += `<rect x="0" y="${rowY(i)}" width="${W}" height="${ROW_H}" fill="#1e3a8a"/>`; // Nền xanh cho dòng Kế hoạch
  });
  
  // 4. Vẽ thanh thời gian & Milestone
  let summaryPoints = [];
  let lastTextX = -9999;

  rows.forEach((r, i) => {
    const y = rowY(i); const t = r.data;
    
    // Bỏ qua không vẽ thanh cho dòng tiêu đề
    if (r.isTitleRow) return;
    
    // Vẽ dòng Timeline
    if (r.type === 'summary') {
      const ptList = r.pts || [];
      if (ptList.length > 0) {
        let minX = Infinity, maxX = -Infinity;
        ptList.forEach(pt => {
          let cx = X(pt.date);
          // Nếu xem theo Buổi/Giờ, tính chính xác vị trí Sáng/Chiều
          if (slotsPerDay > 1) {
             cx += pt.buoi === 'Chiều' ? dw + dw/2 : dw/2;
          } else {
             cx += dw/2;
          }
          
          if (cx < minX) minX = cx;
          if (cx > maxX) maxX = cx;
          summaryPoints.push({ x: cx, y: y + ROW_H / 2, text: pt.text, isStar: pt.isStar });
        });
        // Vẽ đường kẻ đỏ dày
        g += `<line x1="${minX}" x2="${maxX}" y1="${y + ROW_H/2}" y2="${y + ROW_H/2}" stroke="#dc2626" stroke-width="4"/>`;
      }
      return;
    }

    if (!t) return;
    
    let x1 = X(r.start);
    let w = r.days === 0 ? 0 : Math.max(0, r.days * dayW);
    // Nếu bắt đầu vào buổi Chiều, luôn dời thanh bar sang nửa phải của ngày
    if (r.buoi === 'Chiều') x1 += dayW / 2; 
    
    const by = y + (ROW_H - 18) / 2, bh = 18;
    
    // Vẽ Milestone (Nếu có)
    if (r.days === 0) {
      const cx = x1 + (r.buoi === 'Chiều' ? dayW / 2 : 0);
      const cy = y + ROW_H / 2;
      g += `<circle cx="${cx}" cy="${cy}" r="5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>`;
      return;
    }
    
    // Vẽ thanh bar
    if (r.days > 0) {
      // 1. Luôn vẽ nền màu xám cho toàn bộ thanh bar (đại diện cho tương lai)
      let baseColor = (r.type === 't') ? '#cbd5e1' : '#94a3b8';
      g += `<rect x="${x1}" y="${by}" width="${w}" height="${bh}" fill="${baseColor}" rx="2" data-tip="${r.tip || 'Công việc'}"/>`;

      // 2. Tính toán và vẽ đè màu xanh cho phần đã/đang diễn ra (tính đến thời điểm hiện tại)
      const todayStr = D.today();
      if (r.start <= todayStr) {
        let xNow = X(todayStr) + dayW / 2; // Dừng đúng ở đường Now (giữa ngày hôm nay)
        let x2 = x1 + w;               // Điểm kết thúc của toàn bộ thanh bar
        let activeWidth = Math.min(x2, xNow) - x1; // Độ rộng phần thực tế đã chạm tới

        if (activeWidth > 0) {
          let activeColor = (r.type === 't') ? '#6ee7b7' : '#059669';
          g += `<rect x="${x1}" y="${by}" width="${activeWidth}" height="${bh}" fill="${activeColor}" rx="2"/>`;
        }
      }
    }
  });

  // Vẽ đè các nốt tròn vàng và Text cho dòng Timeline (Có xử lý so le)
  summaryPoints.forEach((p, idx) => {
    if (p.isStar) {
      // Vẽ ngôi sao đỏ
      const cx = p.x, cy = p.y, r = 7;
      g += `<path d="M${cx},${cy-r} L${cx+r*0.3},${cy-r*0.3} L${cx+r},${cy-r*0.3} L${cx+r*0.4},${cy+r*0.2} L${cx+r*0.6},${cy+r} L${cx},${cy+r*0.5} L${cx-r*0.6},${cy+r} L${cx-r*0.4},${cy+r*0.2} L${cx-r},${cy-r*0.3} L${cx-r*0.3},${cy-r*0.3} Z" fill="#ef4444"/>`;
      if (p.text) {
        g += `<text x="${cx}" y="${cy - 12}" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626" stroke="#fff" stroke-width="3" paint-order="stroke">${p.text}</text>`;
      }
    } else {
      // Vẽ nốt tròn vàng bình thường
      g += `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>`;
      if (p.text) {
        let offset = 0;
        // Kiểm tra xem có mốc nào trước đó nằm quá sát không
        for (let j = 0; j < idx; j++) {
          if (summaryPoints[j].text && Math.abs(summaryPoints[j].x - p.x) < 55) {
            offset = 14; // Chỉ đẩy lên 1 cấp để không tràn ra ngoài dòng
          }
        }
        let ty = p.y - 12 - offset;
        g += `<text x="${p.x}" y="${ty}" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b" stroke="#fff" stroke-width="3" paint-order="stroke">${p.text}</text>`;
      }
    }
  });

  // 5. Vẽ đường "Now" (Hình tam giác đỏ)
  const tx = X(today) + dayW / 2;
  g += `<polygon points="${tx-20},0 ${tx+20},0 ${tx},16" fill="#ef4444"/>`;
  g += `<text x="${tx}" y="12" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Now</text>`;
  g += `<line x1="${tx}" x2="${tx}" y1="16" y2="${H}" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>`;

  return { svg: g, W, H, tx };
}
function ganttRange(vt) {
  const today = D.today(); 
  let a = vt.length ? vt.reduce((m, t) => t.s < m ? t.s : m, vt[0].s) : today; 
  let b = vt.length ? vt.reduce((m, t) => t.e > m ? t.e : m, vt[0].e) : today;
  if (today < a) a = today; if (today > b) b = today;
  
  if (UI.g.zoom === 'hour' || UI.g.zoom === 'halfday') {
    a = D.add(a, -1); b = D.add(b, 1);
  } else {
    a = D.add(a, -2); b = D.add(b, 2);
  }
  return { a, n: D.diff(b, a) + 1 };
}

                </td>
              </tr>`;
            }).join('')}

        </table>
      </div>
    </div>

}

function renderCalendar(body, all) {
  const ym = UI.calYm || D.ymNow();
  const [y, m] = ym.split('-').map(Number);
  const firstDow = D.dow(ym, 1), totalDays = D.daysIn(ym);
  const prevDays = D.daysIn(D.ymAdd(ym, -1));
  const today = D.today();
  const cells = [];
  for (let i = firstDow - 1; i >= 0; i--) { cells.push({ d: D.ymAdd(ym, -1) + '-' + pad(prevDays - i), other: true }); }
  for (let i = 1; i <= totalDays; i++) { cells.push({ d: ym + '-' + pad(i), other: false }); }
  while (cells.length % 7 !== 0) { const n = cells.length - firstDow - totalDays + 1; cells.push({ d: D.ymAdd(ym, 1) + '-' + pad(n), other: true }); }
  const rows = assignmentsFiltered();
  const evByDay = by(rows, a => a.deadline);
  body.innerHTML = `<div class="row mb"><button class="btn sm" data-act="calPrev">‹ Tháng trước</button><b style="margin:0 10px">${F.month(ym)}</b><button class="btn sm" data-act="calNext">Tháng sau ›</button><div class="grow"></div><button class="btn sm" data-act="calToday">Hôm nay</button></div>
    <div class="cal"><div class="cal-head">${D.dowName.map(n => `<div>${n}</div>`).join('')}</div>
    <div class="cal-body">${cells.map(c => {
      const evs = (evByDay[c.d] || []).slice(0, 4);
      return `<div class="cal-cell ${c.other ? 'other' : ''} ${c.d === today ? 'today' : ''}">
        <div class="cal-day">${D.parse(c.d).getDate()}</div>
        ${evs.map(a => `<div class="cal-ev" style="background:${ASM_C[a.trangThai]}" data-act="asmView" data-id="${a.id}" title="${esc(a.ten)}">${esc(a.ten)}</div>`).join('')}
        ${(evByDay[c.d] || []).length > 4 ? `<div class="muted small">+${(evByDay[c.d] || []).length - 4} nữa</div>` : ''}
      </div>`;
    }).join('')}</div></div>`;
}
function renderAsmGantt(body, all) {
  const rows = assignmentsFiltered();
  if (!rows.length) { body.innerHTML = '<div class="empty">Chưa có việc</div>'; return; }
  
  const vt = rows.map(a => ({ ...a, s: a.start || a.deadline, e: a.deadline, days: Math.max(1, D.diff(a.deadline, a.start || a.deadline) + 1), st: a.late ? 'Trễ hạn' : a.trangThai === 'Hoàn thành' ? 'Hoàn thành' : 'Đang làm', pct: a.pct }));
  
  // Tính toán range và cột
  const range = ganttRange(vt), slotsPerDay = UI.g.zoom === 'halfday' ? 2 : UI.g.zoom === 'hour' ? 8 : 1;
  const minDw = { day: 40, halfday: 25, hour: 15, week: 12, month: 4 }[UI.g.zoom] || 40;
  const HEAD_H = slotsPerDay > 1 ? 78 : 48;
  const ROW_H = 56;
  
  const containerW = body.clientWidth || 1200;
  const availableW = containerW - 720 - 160 - 20; 
  const totalSlots = range.n * slotsPerDay;
  let dw = minDw;
  if (availableW > totalSlots * minDw) dw = Math.floor(availableW / totalSlots);

  const ganttRows = vt.map(a => ({ 
    type: 't', data: a, start: a.s, end: a.e, days: a.days, pct: a.pct, 
    color: ASM_C[a.trangThai] || '#94a3b8', ten: a.ten, id: a.id, 
    tip: `${a.ten}\n${F.date(a.s)} - ${F.date(a.e)}\n${a.pct}%` 
  }));

function renderTaskTab(a, d, tab) {

    return card('Sub-tasks (Checklist)', `<div>${ck.length ? ck.map(c => `<div class="ck ${c.done ? 'done' : ''}">

      <button class="rm" data-act="ckDel" data-id="${a.id}" data-cid="${c.id}">${ic('x')}</button>
    </div>`).join('') : '<div class="empty">Chưa có sub-task nào</div>'}</div>
    <div class="row mt"><input class="inp grow" id="ckNew" placeholder="Nhập tên sub-task..." style="flex:1"><input type="date" class="inp" id="ckDeadline" style="width:150px"><button class="btn pri" data-act="ckAdd" data-id="${a.id}">${ic('plus')} Thêm</button></div>`, { sub: `${d.ckDone}/${d.ckTotal} hoàn thành` });
  }
  if (tab === 'comments') {
    const cs = a.comments.slice().sort((x, y) => (x.at || '').localeCompare(y.at || ''));
    return card('Trao đổi', `<div class="cmts">${cs.length ? cs.map(c => { const p = personOf(c.by); return `<div class="cmt">${avatar(p, 'sm')}<div class="cmt-body"><div><span class="who">${esc(p?.ten || 'Ai đó')}</span><span class="when">${c.at ? new Date(c.at).toLocaleString('vi-VN') : ''}</span></div><div class="text">${esc(c.text)}</div></div></div>`; }).join('') : '<div class="empty">Chưa có trao đổi</div>'}</div>
    <div class="row"><select class="inp" id="cmtBy" style="width:auto">${DB.people.map(p => `<option value="${p.id}">${esc(p.ten)}</option>`).join('')}</select><input class="inp grow" id="cmtNew" placeholder="Nhập nội dung..." style="flex:1"><button class="btn pri" data-act="cmtAdd" data-id="${a.id}">${ic('send')} Gửi</button></div>`, { sub: `${cs.length} bình luận` });

    return card('Đính kèm', `${a.dinhKem.length ? `<div class="attach-list">${a.dinhKem.map((f, i) => `<div class="attach-item">${ic('file')}<span class="fn">${esc(f.ten)}</span><span class="sz">${f.data && f.data.startsWith('data:image') ? 'Ảnh' : 'File'}</span>${f.data && f.data.startsWith('data:image') ? `<button class="ibtn" onclick="window.open('${f.data}')">${ic('eye')}</button>` : ''}<button class="ibtn del" data-act="attachDel" data-id="${a.id}" data-i="${i}">${ic('x')}</button></div>`).join('')}</div>` : '<div class="empty">Chưa có đính kèm</div>'}

  }
  return '';

  asmAccept: d => { const a = DB.assignments.find(x => x.id === d.id); if (a) { a.trangThai = 'Đang làm'; App.changed(); toast('Đã nhận việc', 'ok'); } },
  asmSubmit: d => { const a = DB.assignments.find(x => x.id === d.id); if (a) { a.trangThai = 'Chờ duyệt'; if (a.pct < 100) a.pct = 100; App.changed(); toast('Đã gửi duyệt', 'ok'); } },
  asmApprove: d => { const a = DB.assignments.find(x => x.id === d.id); if (a) { a.trangThai = 'Hoàn thành'; a.pct = 100; a.ngayDuyet = D.today(); App.changed(); toast('Đã duyệt hoàn thành', 'ok'); } },
  asmReject: async d => { const a = DB.assignments.find(x => x.id === d.id); if (!a) return; const r = await Modal.confirm('Trả lại việc này để làm tiếp?', { ok: 'Trả lại' }); if (r) { a.trangThai = 'Đang làm'; App.changed(); toast('Đã trả lại', 'ok'); } },

  },
  ckToggle: d => { const a = DB.assignments.find(x => x.id === d.id); if (!a) return; const c = a.checklist.find(x => x.id === d.cid); if (c) { c.done = !c.done; App.changed(); } },
  ckDel: d => { const a = DB.assignments.find(x => x.id === d.id); if (!a) return; a.checklist = a.checklist.filter(x => x.id !== d.cid); App.changed(); },

  attachDel: d => { const a = DB.assignments.find(x => x.id === d.id); if (!a) return; a.dinhKem.splice(+d.i, 1); App.changed(); },

  calToday: () => { UI.calYm = D.ymNow(); App.render(); }
});

    const peopleStats = DB.people.map(p => {
        const pAsms = asms.filter(a => a.nguoiNhan === p.id).filter(a => a.trangThai !== 'Hủy'); // Bỏ qua việc đã Hủy
        
        const done = pAsms.filter(a => a.trangThai === 'Hoàn thành').length;
        const late = pAsms.filter(a => a.late).length; // Việc trễ hạn (chưa hoàn thành)

              const clickAttr = isLate ? ` data-act="viewLateKanban" data-person="${x.p.id}"` : '';
              const cursor = isLate ? 'cursor:pointer;' : '';
              return s.val > 0 ? 
                `<div ${clickAttr} style="width:${(s.val/x.total)*100}%; background:${s.color}; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11.5px; font-weight:600; overflow:hidden; ${cursor}" title="${s.val} việc${isLate ? ' quá hạn (Bấm để xem)' : ''}">${s.val}</div>` 
                : '';
            }).join('');

            return `
            <div style="display:flex; align-items:center; gap:12px; font-size:13px">
              <div style="width:130px; text-align:right; font-weight:600; color:#344054; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${esc(x.p.ten)}">${esc(x.p.ten)}</div>
              <div style="width:36px; text-align:center; font-weight:700; color:var(--p-d); background:var(--p-50); border-radius:4px; padding:2px 0;">${x.total}</div>
              <div style="flex:1; height:24px; background:#f3f4f6; border-radius:6px;">
                ${x.total > 0 ? `
                <div style="width:${barW}%; display:flex; height:100%; border-radius:6px; overflow:hidden;">
                  ${barHtml}
                </div>` : ''}
              </div>
              <div style="width:60px; text-align:right; font-weight:600; color:${x.pct >= 100 ? '#059669' : x.pct > 0 ? '#b45309' : '#98a2b3'};">${x.total ? x.pct + '%' : '—'}</div>
            </div>
            `;
          }).join('')}
        </div>
      ` : '<div class="empty">Chưa có dữ liệu</div>')}
    </div>`;

    // Vẽ bảng sắp đến hạn
    setTimeout(() => {
      const el2 = $('#dSoon'); if (!el2) return;
      table(el2, { id: 'soon', rows: soonTasks, pageSize: 5, 
        onRow: a => { App.go('tasks'); setTimeout(() => { UI.sub = 'detail'; UI.asmId = a.id; UI.tab.taskDetail = 'info'; App.render(); }, 50); },
        columns: [
          { key: 'ten', label: 'Công việc', render: a => `<b>${esc(a.ten)}</b>` },
          { key: 'nguoiNhan', label: 'Người nhận', val: a => personOf(a.nguoiNhan)?.ten || '', render: a => personOf(a.nguoiNhan) ? esc(personOf(a.nguoiNhan).ten.split(' ').slice(-2).join(' ')) : '—' },
          { key: 'deadline', label: 'Hạn chót', render: a => F.date(a.deadline) },
          { key: 'daysLeft', label: 'Còn lại', render: a => `<span class="badge ${a.daysLeft <= 2 ? 'b-red' : a.daysLeft <= 5 ? 'b-amber' : 'b-blue'}">${a.daysLeft} ngày</span>` }
        ], search: false 
      });
    }, 0);
  },
  excel() {
    XLSX.save('Tong quan Giao viec', [
      xSheet('Tổng quan', 'TỔNG QUAN GIAO VIỆC', [
        { key: 'chiTieu', label: 'Chỉ tiêu' }, { key: 'giaTri', label: 'Giá trị' }
      ], [
        ['Tổng công việc', DB.assignments.length],
        ['Đang làm', DB.assignments.filter(a => a.trangThai === 'Đang làm').length],
        ['Chờ duyệt', DB.assignments.filter(a => a.trangThai === 'Chờ duyệt').length],
        ['Hoàn thành', DB.assignments.filter(a => a.trangThai === 'Hoàn thành').length],
        ['Quá hạn', DB.assignments.map(asmDerived).filter(a => a.late).length]
      ], { noFilter: true })
    ]);
  }
};

/* ============================================
   NHÂN SỰ
   ============================================ */
function personForm(p) {
  const isNew = !p;
  Form.open({ title: isNew ? 'Thêm người' : 'Sửa thông tin', fields: [{ key: 'ten', label: 'Họ và tên', required: true, full: true }, { key: 'vaiTro', label: 'Vai trò / bộ phận', full: true }], width: 520, value: p || {},
    onSave: d => { if (isNew) DB.people.push({ id: uid(), ...d }); else Object.assign(p, d); App.changed(); toast('Đã lưu', 'ok'); },
    onDelete: isNew ? null : async () => { if (await Modal.confirm(`Xóa ${esc(p.ten)}? Các việc của người này sẽ chuyển thành "Chưa giao".`, { ok: 'Xóa', danger: true })) { DB.topicTasks.forEach(t => { if (t.nguoi === p.id) t.nguoi = ''; }); DB.assignments.forEach(a => { if (a.nguoiNhan === p.id) a.nguoiNhan = ''; if (a.nguoiGiao === p.id) a.nguoiGiao = ''; }); DB.topics.forEach(t => { if (t.nguoiChuTri === p.id) t.nguoiChuTri = ''; t.thanhVien = t.thanhVien.filter(x => x !== p.id); }); DB.people = DB.people.filter(x => x !== p); App.changed(); } } });
}
const vPeople = {
  title: 'Nhân sự', icon: 'users', desc: 'Người tham gia, khối lượng công việc',
  tools: () => `<button class="btn pri" data-act="uAdd">${ic('plus')} Thêm người</button>`,
  render(el) {
    const rows = DB.people.map(p => {
      const asms = DB.assignments.map(asmDerived).filter(a => a.nguoiNhan === p.id);
      return { ...p, asm: asms.length, doing: asms.filter(a => a.trangThai === 'Đang làm').length, late: asms.filter(a => a.late).length, done: asms.filter(a => a.trangThai === 'Hoàn thành').length, pct: asms.length ? sum(asms, a => a.pct) / asms.length : 0 };
    });
    table(el, { id: 'ppl', rows, ph: 'Tìm tên, vai trò...', onRow: r => personForm(DB.people.find(x => x.id === r.id)),
      columns: [
        { key: 'ten', label: 'Họ và tên', render: p => `<span class="who">${avatar(p)}<span><b>${esc(p.ten)}</b><small>${esc(p.vaiTro || '')}</small></span></span>` },
        { key: 'asm', label: 'Tổng việc', fmt: 'num', dec: 0, sum: 1 },
        { key: 'doing', label: 'Đang làm', fmt: 'num', dec: 0, sum: 1 },
        { key: 'late', label: 'Trễ hạn', render: p => p.late ? `<span class="badge b-red">${p.late}</span>` : '0', fmt: 'num', dec: 0, sum: 1 },
        { key: 'done', label: 'Hoàn thành', fmt: 'num', dec: 0, sum: 1 },
        { key: 'pct', label: '% TB', render: p => p.asm ? pbar(p.pct) : '<span class="muted">-</span>', sortVal: p => p.pct }
      ],
      actions: r => `<button class="ibtn" data-act="uEdit" data-id="${r.id}" data-tip="Sửa">${ic('edit')}</button><button class="ibtn del" data-act="uDel" data-id="${r.id}" data-tip="Xóa">${ic('trash')}</button>`,
      empty: 'Chưa có ai. Bấm "Thêm người".'
    });
  },
  excel() { XLSX.save('Nhan su', [xSheet('Nhân sự', 'DANH SÁCH NHÂN SỰ', [{ key: 'ten', label: 'Họ tên' }, { key: 'vaiTro', label: 'Vai trò' }], DB.people)]); }
};
Object.assign(ACT, {
  uAdd: () => personForm(null), uEdit: d => personForm(DB.people.find(x => x.id === d.id)),
  uDel: async d => { const p = DB.people.find(x => x.id === d.id); if (await Modal.confirm(`Xóa <b>${esc(p.ten)}</b>?`, { ok: 'Xóa', danger: true })) { DB.topicTasks.forEach(t => { if (t.nguoi === p.id) t.nguoi = ''; }); DB.assignments.forEach(a => { if (a.nguoiNhan === p.id) a.nguoiNhan = ''; }); DB.people = DB.people.filter(x => x !== p); App.changed(); } }
});

/* ============================================
   CÀI ĐẶT
   ============================================ */
const vSet = {
  title: 'Cài đặt', icon: 'settings', desc: 'Thông tin in, cách tính ngày, cảnh báo', print: false,
  render(el) {
    const s = DB.settings;
    el.innerHTML = `<div class="grid cols-2">
      ${settingsCard('Thông tin đơn vị (in trên báo cáo)', COMPANY_FIELDS, s.company)}
      ${settingsCard('Cách tính lịch', [{ key: 'calMode', label: 'Cách tính số ngày thực hiện', type: 'select', full: true, options: [{ value: 'cal', label: 'Tính tất cả các ngày' }, { value: 'mf', label: 'Chỉ tính ngày làm việc (bỏ T7, CN)' }] }, { key: 'warnDays', label: 'Cảnh báo trước hạn (ngày)', type: 'number', min: 1 }], s)}
    </div>`;
  }
};

/* ============================================
   BOOTSTRAP
   ============================================ */
// ==========================================
// LOGIC ĐĂNG NHẬP VÀ KHỞI TẠO APP
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
  const loginScreen = document.getElementById('loginScreen');
  const loginBtn = document.getElementById('loginBtn');
  const loginPassword = document.getElementById('loginPassword');
  const loginError = document.getElementById('loginError');

  async function checkPassword() {
      const enteredPass = loginPassword.value;
      try {
          const docRef = db.collection('config').doc('settings');
          const doc = await docRef.get();
          
          if (doc.exists && doc.data().password === enteredPass) {
              loginScreen.style.display = 'none'; 
              
              if (!window.appInitialized) {
                   window.appInitialized = true; 
                   
                   // --- KHỞI TẠO APP ---
                   App.init({
                     id: 'gantt-2modules', title: 'Chuyên đề & Giao việc', tagline: 'Cải tiến · Giao việc', icon: 'target', fileName: 'QuanLyChuyenDe_GiaoViec.html', theme: THEME,
                     palette: ['#2563eb', '#f59e0b', '#8b5cf6', '#ef4444', '#06b6d4', '#ec4899', '#64748b'],
                     sample: sampleDB, empty: emptyDB, migrate, home: 'dashboard',
                     counts: () => [['Chuyên đề', DB.topics.length], ['Hoạt động PDCA', DB.topicTasks.length], ['Giao việc', DB.assignments.length], ['Nhân sự', DB.people.length]],
                     nav: [
                       { group: 'Tổng quan', items: ['dashboard'] },
                       { group: 'Giao việc', items: ['tasks'] },
                       { group: 'Chuyên đề Cải tiến', items: ['topics'] },
                       { group: 'Quản lý', items: ['people'] },
                       { group: 'Thiết lập', items: ['caidat'] }
                     ],
                     views: { dashboard: vDashboard, topics: vTopics, tasks: vTasks, people: vPeople, caidat: vSet }
                   });
                   // ---------------------
                   
                   toast('Đăng nhập thành công!', 'ok');
              }
          } else {
              loginError.style.display = 'block';
          }
      } catch (error) {
          console.error("Lỗi chi tiết:", error);
          alert("Lỗi kết nối Firebase: " + error.message);
      }
  }

  loginBtn.addEventListener('click', checkPassword);
  loginPassword.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
  });
});
</script>
